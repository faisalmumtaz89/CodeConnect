[package]
name = "codeconnect-bench-mocks"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "mock-claude-host"
path = "src/mock_claude_host.rs"

[[bin]]
name = "mock-codex"
path = "src/mock_codex.rs"

[[bin]]
name = "mock-client"
path = "src/mock_client.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
