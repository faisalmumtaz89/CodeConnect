[workspace]
resolver = "2"
members = [
    "protocol",
    "cc-hook",
    "ccd",
    "codeconnect",
    "demo-daemon",
    "push-core",
    "push-relay",
    "soak",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
# CI pins this exact version so the floor is tested, not merely declared. 1.85 is
# what the lockfile actually needs: `rustls` pulls `zeroize`, which is published
# with `edition2024`, and no earlier Cargo can parse that manifest.
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
protocol = { path = "protocol" }
push-core = { path = "push-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reserved `codex` argv parser inspects `-c key=value` overrides the way
# codex itself does — the value is parsed as TOML — so a structural override
# (`-c 'features={hooks=false}'`) that reaches an ownership key cannot slip past
# a naive text scan. Pinned to the SAME toml the codex 0.147 binary embeds
# (toml-0.9.11, TOML spec 1.1) so our grammar matches codex's exactly: a TOML-1.1
# form codex applies (a trailing comma in an inline table, a multiline inline
# table) must not parse-fail here and get forwarded while codex acts on it. And a
# structural value we still cannot parse is refused, never forwarded. **Exact**
# version pin (not caret) so a patch bump cannot drift our grammar from codex's.
toml = "=0.9.11"
sha2 = "0.10"
# One symbol: flock(2), for the update checker's cross-process throttle. The
# kernel releases the lock when the holder dies, which is what deletes the
# entire corpse/staleness/takeover protocol a file-based lock would need.
libc = "0.2"
# `backup` is SQLite's own online-backup API: it copies a live database under
# WAL without stopping writers, which a file copy of a WAL database cannot do —
# it captures a main file whose newest pages are still in the log.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "process",
    "fs",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# TLS for `wss://`. rustls rather than native-tls: `tailscale cert` writes PEM,
# which rustls loads directly, whereas Security.framework wants a PKCS#12
# identity and would drag in an openssl shell-out to build one. `ring` rather
# than the default aws-lc-rs: no C toolchain, and this is a two-cipher server.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

# APNs, and only APNs, needs these two.
#
# `h2` because Apple's push endpoint speaks **HTTP/2 only** — there is no 1.1
# fallback to degrade to — and because a full HTTP client stack would be a large
# dependency for one POST to one host. `h2` rides the `tokio-rustls` connection
# this workspace already builds for `wss://`; the ALPN token is the only new
# thing on the wire.
h2 = "0.4"
http = "1"
# The provider token is an ES256 JWT over Apple's P-256 `.p8`. `ring` is already
# here underneath rustls, so signing costs no new crate — and `rustls-pemfile`
# already parses the PKCS#8 PEM the `.p8` is written in.
ring = "0.17"
# The platform trust store for the APNs connection: Apple presents a public
# chain, so the system roots are exactly right and vendoring a root set would be
# a second thing to keep current.
rustls-native-certs = "0.8"

# FSEvents for the transcript tailer. `default-features = false` drops
# crossbeam-channel; notify's callback feeds a tokio channel directly.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# QR rendering for `codeconnect pair`. `default-features = false` drops the `image`
# renderer and leaves the crate with no transitive dependencies at all.
qrcode = { version = "0.14", default-features = false }

# The terminal wire carries raw bytes as base64 inside the existing JSON frames.
base64 = "0.22"

# The push relay, and only the push relay, needs the rest of this file. It is
# the one member that serves HTTP to strangers and the one that runs on Linux.
#
# `axum` because the relay's whole defence is a closed request schema behind a
# body limit, and both of those are things a framework already gets right;
# hand-rolling them on `hyper` means hand-rolling the limit that keeps a
# hostile body from being read in full. `tower` is the middleware vocabulary
# axum is written in, so it is not a second choice.
axum = "0.8"
tower = "0.5"

# Outbound HTTP/2 to Apple. `h2` above is one connection driven by hand, which
# is right for a Mac sending its own pushes and wrong for a service holding a
# connection open per environment for every user at once: Apple ends a
# connection with `GOAWAY`, and something has to reconnect without replaying a
# request that may already have reached the phone.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
# `native-tokio` reads the platform trust store, which in the relay's container
# is the `ca-certificates` package rather than the Keychain. `ring` for the
# same reason as everywhere else here: no C++ toolchain.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http2",
    "native-tokio",
    "tls12",
] }
http-body-util = "0.1"
bytes = "1"

# Logs as JSON documents rather than lines, because the relay's logs are read
# by a log service and searched for the absence of things — a bearer, a token,
# an address — and a grep over prose cannot prove absence the way a fixed set
# of typed fields can.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# App Attest verification, which is parsing attacker-supplied bytes and is
# therefore all borrowed code. The attestation object is CBOR wrapping an X.509
# chain that has to be verified to Apple's root; `rustls-webpki` is the path
# validator rustls already trusts, and `rustls-pki-types` is the vocabulary it
# speaks — the certificate, trust-anchor and verification-time types come from
# there rather than from `rustls` itself.
ciborium = "0.2"
x509-parser = "0.16"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
    "std",
] }

# Certificates for the attestation tests, minted at test time. A checked-in
# fixture chain would be a private key in the repository and would expire.
rcgen = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
