[package]
name = "push-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The CodeConnect push relay: a closed event schema in, a generic Apple notification out."

# The binary name is deployment surface. `ops/push-relay/Dockerfile` copies
# `/src/target/release/push-relay` out of the build stage by that exact path, so
# renaming this breaks the image rather than the build.
[[bin]]
name = "push-relay"
path = "src/main.rs"

# The development seed tool, which writes a binding without an attestation.
#
# **`required-features` is what keeps it out of the production image**, not a
# runtime flag and not a comment. `ops/push-relay/Dockerfile` runs
# `cargo build -p push-relay`, which builds no binary that needs a feature the
# default set does not enable — so the tool is not compiled, not copied, and not
# present to be run. Decision 1 asks for exactly that: local-only, absent from
# the production image, and impossible to enable through a network request.
[[bin]]
name = "relayctl"
path = "src/bin/relayctl.rs"
required-features = ["seed"]

[features]
default = []
# Off by default, and the only thing it turns on is the binary above.
seed = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
# The APNs transport is a pooled client rather than a hand-written pool: Apple
# ends a connection with `GOAWAY`, and reconnecting without resubmitting a
# request that may already have reached a phone is the part that has to be
# borrowed rather than written here.
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
push-core = { workspace = true }
ring = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
# The attestation tests mint their own certificate chains. A checked-in chain
# would mean a private key in the repository and a suite that starts failing on
# a date nobody chose.
rcgen = { workspace = true }
# The APNs transport is proven against a real HTTP/2 server on localhost, which
# is the only way to count the connections the pool opens and the streams Apple
# ends up seeing. `h2` is that server; nothing in the relay speaks it otherwise.
h2 = { workspace = true }
# Routes are exercised by calling the router as the `tower::Service` it is,
# rather than by binding a port: a test that needs a listening socket is a test
# that can fail because the machine was busy.
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
