[package]
name = "codeconnect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CodeConnect command line: daemon install, pairing, sessions, mail tools, updates."

[[bin]]
name = "codeconnect"
path = "src/main.rs"

[features]
default = []
# A rig build that installs its daemon job under a test label (`protocol::launchd_label`).
test-launchd-label = ["protocol/test-launchd-label"]

[dependencies]
protocol = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
qrcode = { workspace = true }

# The Linux release is proven by an Ed25519 signature over its checksum files
# (`update_install::verify_checksum`); macOS proves each binary with codesign.
[target.'cfg(target_os = "linux")'.dependencies]
ring = { workspace = true }
