[package]
name = "codeconnect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CodeConnect shim: hosts a real claude session in a private tmux server, attached in place."

[[bin]]
name = "codeconnect"
path = "src/main.rs"

# No tokio: the shim execs away within milliseconds and the supervisor is a
# two-thread blocking loop. An async runtime would be pure startup cost.
[dependencies]
protocol = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
qrcode = { workspace = true }
