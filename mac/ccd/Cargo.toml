[package]
name = "ccd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CodeConnect daemon: event log, agent hosts, tailnet WebSocket server, push."

[[bin]]
name = "ccd"
path = "src/main.rs"

[features]
# A rig build that recognises itself by its job's test label (`protocol::launchd_label`).
test-launchd-label = ["protocol/test-launchd-label"]

[dependencies]
protocol = { workspace = true }
push-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
h2 = { workspace = true }
# The relay request is an ordinary POST, so unlike the APNs path — whose whole
# header set is built inside `push-core` — this one names `http`'s own types.
http = { workspace = true }
ring = { workspace = true }
rustls-native-certs = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# TEST-ONLY. The tests write PEM certificates, whose bodies are base64.
base64 = { workspace = true }
# `test-util` for the paused clock a test runs on when its timing must not depend on how
# busy the machine is.
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
