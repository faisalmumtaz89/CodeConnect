[package]
name = "ccd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CodeConnect daemon: event log, hook gate, tailnet WebSocket server, push."

[[bin]]
name = "ccd"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
push-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
h2 = { workspace = true }
ring = { workspace = true }
rustls-native-certs = { workspace = true }
notify = { workspace = true }
# The terminal wire carries raw pane bytes as base64 inside the existing JSON
# frames. See `terminal.rs` for the carrier itself.
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
