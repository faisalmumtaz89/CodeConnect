[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared CodeConnect types: event log envelope, unix-socket IPC frames, WSS messages."

[features]
# A rig build's launchd label: the daemon's job takes `com.codeconnect.ccd.test-<id>` from the
# environment, so a test install never reaches the real job. Never the default, so the binaries
# a user runs carry neither the variable nor the code that reads it. See `launchd_label`.
test-launchd-label = []

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The composite wire-id codec emits/parses base64url. Already a workspace
# dependency (the terminal carrier uses it); shared here so the id is one
# well-tested alphabet rather than a second hand-rolled one.
base64 = { workspace = true }
