# Builds, signs, notarizes and verifies the Mac binaries, and the Mac app that
# carries them, for a release. The Linux archives are built by linux-build.yml,
# which this calls, and attached beside them.
#
# **Every run proves a draft end to end; publication promotes it unchanged.**
# `codeconnect update` installs whatever `releases/latest` points at, so the
# moment of publication is the moment every machine can be handed these bytes.
# A tag push builds, signs, notarizes and verifies a draft and stops.
# Publishing requires a person to run the workflow with publishing enabled
# *against a draft that already exists* (or that draft published as a
# pre-release for the update proof, which no update path offers): that run
# builds, signs and notarizes
# nothing and reads no repository secret. It downloads the draft's nineteen
# assets, checks them with the same `release-verify.sh` the draft run used, and
# publishes exactly those bytes, so what was tested is what people download.
#
# **One commit, pinned once.** The `pin` job resolves the tag to a commit SHA
# and every other job checks out that SHA — never the tag, which is mutable.
# Publication re-verifies that the tag still resolves to the pinned commit, so
# a tag moved mid-run is a refusal rather than a release whose halves came from
# different code.
#
# **The draft is handled by its numeric id.** GitHub's get-release-by-tag
# endpoint returns only *published* releases — a draft is invisible to it — so
# every step after creation addresses the draft by the id captured at creation
# (or recovered from the authenticated release listing on a rerun), and
# publication is a PATCH on that id after rechecking what it holds.
#
# **Nothing in the tree is modified before building.** `protocol/build.rs`
# bakes the commit and a dirty flag by reading git directly, so a version bump,
# a `sed`, or a generated file here would ship binaries permanently claiming
# they were built from an edited tree. Per RELEASING.md the version is
# committed before the tag, so there is nothing to do.
#
# **Order is load-bearing:** build each arch natively → `lipo` → *then* sign →
# *then* notarize. Signing before `lipo` produces a universal file whose
# signature no longer matches what it contains.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.4.0"
        required: true
      publish:
        description: "Publish. Leave off to stop at a verified draft."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # The logical tag, never `github.ref`. A tag push arrives as
  # `refs/tags/v0.4.0` and a manual dispatch for that same tag arrives as
  # `refs/heads/main`, so keying on the ref would let two runs for one release
  # proceed at once, each mutating the draft under the other.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned, and the same for both slices: halves built against different
  # minimums are an inconsistent universal binary. This is a published fact
  # rather than whatever the runner image happened to default to.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  pin:
    name: Pin the release commit
    runs-on: ubuntu-latest
    # Reading CI's runs needs actions: read; this job writes nothing.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      tag: ${{ steps.pin.outputs.tag }}
      dir: ${{ steps.pin.outputs.dir }}
    steps:
      # Fully qualified for a dispatch: `actions/checkout` resolves a bare
      # name as a remote *branch* before trying tags, so a branch that happens
      # to be called `v0.5.0` would silently win over the tag of that name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve the tag to one commit, and validate everything about it
        id: pin
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          # Exactly `vX.Y.Z`, no leading zeroes, components inside u64 — the
          # same rule the updater's own parser enforces, from the same file
          # the ordering steps use. A glob would admit `v0.4.0-rc1` or
          # `v0.04.0` and hand a tag downstream that the product refuses.
          # shellcheck source=/dev/null
          . "$GITHUB_WORKSPACE/.github/workflows/version-order.sh"
          case "$tag" in v*) ;; *)
            echo "::error::refusing a tag with no v prefix: $tag"; exit 1 ;;
          esac
          version="${tag#v}"
          if ! valid_version "$version"; then
            echo "::error::refusing a tag that is not plain vX.Y.Z: $tag"
            exit 1
          fi
          in_source="$(awk -F'"' '/^version = /{print $2; exit}' mac/Cargo.toml)"
          if [ "$version" != "$in_source" ]; then
            echo "::error::tag $tag does not match the workspace version $in_source"
            exit 1
          fi
          # `^{commit}` peels an annotated tag; a lightweight tag is already a
          # commit. Everything downstream checks out this SHA, never the tag.
          sha="$(git rev-parse "HEAD^{commit}")"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "dir=codeconnect-$version"
          } >> "$GITHUB_OUTPUT"
          echo "$tag is $sha"

      # "A tag goes on a commit every gate has passed" (RELEASING.md), held
      # here. The newest push run of ci.yml for this exact commit must have
      # finished and passed: a red, cancelled or still running one, or none,
      # is a refusal. A tag pushed before CI is done is built later by running
      # this workflow for the tag. Workflow runs rather than check runs: the
      # commit's check runs include this workflow's own jobs.
      - name: Refuse a commit that CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '.workflow_runs | max_by(.created_at) // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $SHA; push it to a branch CI runs on and wait for green"
            exit 1
          fi
          read -r status conclusion url <<< "$run"
          if [ "$status $conclusion" != "completed success" ]; then
            echo "::error::CI on $SHA is $status, $conclusion: $url"
            exit 1
          fi
          echo "CI passed on $SHA: $url"

      # Before anything is built or signed, so a mistake costs seconds.
      - name: Refuse a release that is not newer than the published one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          # `codeconnect update` installs whatever `releases/latest` points
          # at, and the publish step below explicitly claims "latest"
          # (`make_latest`) — so publishing a lower version today would hand
          # every machine a downgrade as an upgrade. The updater refuses to
          # move backwards; this refuses to create the situation, and the
          # publish step asks again at the moment it matters.
          #
          # The status code decides, explicitly: 200 is an answer, 404 means
          # no release exists yet, and anything else — rate limit, outage — is
          # not permission to guess.
          if ! code=$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"); then
            echo "::error::could not reach the releases API"
            exit 1
          fi
          case "$code" in
            200) ;;
            404) echo "no published release yet — $VERSION is the first"; exit 0 ;;
            *) echo "::error::the releases API answered HTTP $code; refusing to guess"; exit 1 ;;
          esac
          previous="$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")"
          # shellcheck source=/dev/null
          . "$GITHUB_WORKSPACE/.github/workflows/version-order.sh"
          if ! version_strictly_newer "$VERSION" "${previous#v}"; then
            echo "::error::$VERSION is not newer than the published latest '$previous'"
            exit 1
          fi
          echo "$VERSION is newer than ${previous#v}"
          # The update window's notes are written by the merges since the last
          # release (RELEASING.md, step 2), so notes still the last release's
          # would tell every Mac the wrong news.
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/macos/release-notes.txt?ref=$previous" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/previous-notes.txt"; then
            echo "::error::could not read $previous's macos/release-notes.txt"
            exit 1
          fi
          if cmp -s "$RUNNER_TEMP/previous-notes.txt" macos/release-notes.txt; then
            echo "::error::macos/release-notes.txt is still $previous's; write $VERSION's notes"
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: pin
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # A native runner per architecture. `rusqlite` is built with the
          # `bundled` feature, which compiles SQLite from C, and cross-compiling
          # that is the single most likely thing to fail — so the risk class is
          # deleted rather than planned around, at the cost of one extra job.
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      # The pinned SHA, not the tag: a real checkout with history for
      # `build.rs`, and the same commit whichever job runs first.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pin.outputs.sha }}

      - name: Refuse a tree that is not provably clean
        run: |
          # The status has to be *established*, not merely empty: a failed
          # `git status` inside `$( )` yields an empty string, and an
          # `[ -n ... ]` test would read that failure as a clean tree.
          if ! status="$(git status --porcelain)"; then
            echo "::error::git status failed; a clean tree cannot be proven"
            exit 1
          fi
          if [ -n "$status" ]; then
            echo "::error::the tree is dirty; binaries would claim they were built from an edited tree"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --manifest-path mac/Cargo.toml \
            --target ${{ matrix.target }} \
            --bin codeconnect --bin ccd

      - name: Check the deployment target landed
        run: |
          for binary in codeconnect ccd; do
            path="mac/target/${{ matrix.target }}/release/$binary"
            got="$(vtool -show-build "$path" | awk '/minos/ {print $2; exit}')"
            if [ "$got" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$binary targets macOS $got, expected $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
          done

      # Natively, per slice, while each slice can still be run on its own
      # architecture. The combined universal binary can only ever be asked
      # this on the publishing runner, which answers for one of the two
      # halves — the other half would never be asked at all.
      - name: Check the slice says exactly what it is
        env:
          SHA: ${{ needs.pin.outputs.sha }}
          VERSION: ${{ needs.pin.outputs.version }}
        run: |
          # The whole line is knowable from the pinned commit, so it is
          # compared as a literal. A regex built from the version would leave
          # its dots as wildcards, and `0.4.0` would accept `0x4y0`.
          for binary in codeconnect ccd; do
            expected="$binary $VERSION (${SHA:0:12})"
            said="$("mac/target/${{ matrix.target }}/release/$binary" --version)"
            if [ "$said" != "$expected" ]; then
              echo "::error::$binary reports '$said', expected '$expected'"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.arch }}
          # Listed one per line: the artifact glob does not do shell brace
          # expansion, and a pattern that matches nothing uploads nothing.
          path: |
            mac/target/${{ matrix.target }}/release/codeconnect
            mac/target/${{ matrix.target }}/release/ccd
          if-no-files-found: error

  # The agent host's two macOS slices, each built and run on its own
  # architecture's runner; see agent-host-mac.yml.
  agent-host:
    name: Agent host
    needs: pin
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    uses: ./.github/workflows/agent-host-mac.yml
    with:
      ref: ${{ needs.pin.outputs.sha }}

  linux:
    name: Linux
    needs: pin
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.pin.outputs.sha }}

  # The only job that sees the Linux release key. It signs each checksum file
  # and hands on the archives, checksums and signatures; the key never leaves
  # it, and nothing it signs is published by it.
  linux-sign:
    name: Sign the Linux checksums
    needs: [pin, linux]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pin.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: linux
          merge-multiple: true

      - name: Sign
        env:
          KEY: ${{ secrets.LINUX_RELEASE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$key")
          .github/workflows/linux-sign.sh linux "$key" mac/codeconnect/src/update_install.rs

      - uses: actions/upload-artifact@v4
        with:
          name: linux-signed
          path: |
            linux/*.tar.gz
            linux/*.tar.gz.sha256
            linux/*.tar.gz.sha256.sig
          if-no-files-found: error

  draft:
    name: Sign, notarize, verify the draft
    needs: [pin, build, agent-host, linux-sign]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    # The image that carries Xcode 27.1, the one the Mac app is built and
    # tested with (macos-15 has 26.3 at most). It is a preview, so "Build the
    # Mac app" pins Xcode by path and fails loudly if that path is gone. The
    # steps before it use only lipo, codesign and notarytool.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pin.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: slices

      # Both halves come from one pinned commit, so a mismatch means the
      # workflow is wrong, not the code.
      - name: Combine the slices
        env:
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          mkdir -p "$DIR"
          for binary in codeconnect ccd; do
            lipo -create -output "$DIR/$binary" \
              "slices/slice-arm64/$binary" "slices/slice-x86_64/$binary"
            # `upload-artifact` normalises uploaded files to 0644 and `lipo`
            # carries the input mode into its output, so without this the
            # binaries are not executable and every later step that runs one
            # fails.
            chmod 0755 "$DIR/$binary"
            archs="$(lipo -archs "$DIR/$binary")"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$binary is not universal: $archs"; exit 1 ;;
            esac
          done
          # The licence travels with the binaries because the licence says it
          # must: a binaries-only archive is a distribution without its notice.
          cp LICENSE "$DIR/LICENSE"
          # The agent host goes into the same directory, from the slices its
          # build jobs ran, so it is signed, notarized and verified with the
          # others; it is packaged into an archive of its own, and the core
          # archive names its members one by one.
          lipo -create -output "$DIR/cc-agent-host" \
            slices/agent-host-arm64/cc-agent-host-darwin-arm64 \
            slices/agent-host-x86_64/cc-agent-host-darwin-x86_64
          chmod 0755 "$DIR/cc-agent-host"
          archs="$(lipo -archs "$DIR/cc-agent-host")"
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::cc-agent-host is not universal: $archs"; exit 1 ;;
          esac
          if ! cmp -s slices/agent-host-arm64/AGENT_HOST_NOTICES slices/agent-host-x86_64/AGENT_HOST_NOTICES; then
            echo "::error::the two agent host slices carry different notices"
            exit 1
          fi
          cp slices/agent-host-arm64/AGENT_HOST_NOTICES "$DIR/AGENT_HOST_NOTICES"

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # A keychain that exists only for this run, so nothing is left behind
          # on a shared runner image.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # The Developer ID intermediate, from Apple. A p12 exported from
          # Keychain Access carries the leaf and its key but not the chain,
          # and an identity only counts as valid once the chain to Apple's
          # root closes — a developer's Mac has had this intermediate since
          # Xcode first signed in; a fresh runner has only the roots, so
          # without it `find-identity -v` hides the identity as invalid.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          pinned="$(awk -F'"' '/^pub const TEAM_ID/{print $2; exit}' \
            mac/codeconnect/src/update_install.rs)"
          if [ "$TEAM_ID" != "$pinned" ]; then
            echo "::error::APPLE_TEAM_ID is $TEAM_ID but the updater pins $pinned;"
            echo "::error::binaries signed by $TEAM_ID would be refused by every install"
            exit 1
          fi
          identity="$(security find-identity -v -p codesigning \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::no valid Developer ID Application identity in the keychain"
            # Certificate names are not secrets, and what is present decides
            # what is wrong: an entry here that says "Apple Development"
            # means the wrong certificate was exported into the p12; a
            # "Developer ID Application" entry that is only listed without
            # `-v` means its chain or key is incomplete.
            security find-identity -p codesigning || true
            exit 1
          fi
          for binary in codeconnect ccd; do
            codesign --force --options runtime --timestamp \
              --sign "$identity" "$DIR/$binary"
          done
          # The one binary with an entitlement: JavaScriptCore needs allow-jit
          # under the hardened runtime, and nothing else is granted.
          codesign --force --options runtime --timestamp \
            --entitlements mac/agent-host/entitlements.plist \
            --sign "$identity" "$DIR/cc-agent-host"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          # Apple accepts a zip, a flat package or a disk image — not a
          # tarball. The zip exists only to carry the same signed bytes to the
          # notary; the published archive is built from those bytes unchanged,
          # and a notarization ticket is issued against each binary's own hash,
          # so repackaging does not undo it. Nothing can be stapled to a bare
          # executable, so Gatekeeper checks such a binary online.
          ditto -c -k --keepParent "$DIR" notarize.zip
          # `--wait` returns as soon as the submission reaches *a* terminal
          # state, and `Invalid` and `Rejected` are terminal — so a completed
          # `notarytool` is not an accepted one. The status is the only thing
          # that says Apple took these binaries, and every later gate here
          # checks signing, which would still pass on a rejected submission.
          if ! xcrun notarytool submit notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
              --wait --timeout 30m --output-format json \
              > "$RUNNER_TEMP/notarize.json"; then
            cat "$RUNNER_TEMP/notarize.json" || true
            echo "::error::notarytool did not complete"
            exit 1
          fi
          cat "$RUNNER_TEMP/notarize.json"
          status="$(jq -r '.status // empty' "$RUNNER_TEMP/notarize.json")"
          if [ "$status" != "Accepted" ]; then
            id="$(jq -r '.id // empty' "$RUNNER_TEMP/notarize.json")"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" --password "$APP_PASSWORD" || true
            fi
            echo "::error::notarization is '${status:-unknown}', not Accepted"
            exit 1
          fi

      # The same requirement `codeconnect update` enforces on a user's machine.
      # Running it here means a release cannot be drafted that the product
      # would then refuse to install. Each binary must also be signed as
      # itself: macOS keeps a permission a user granted ccd (its access to the
      # Documents folder) against its identifier as well as the team, so a ccd
      # signed under another identifier would lose it on the update.
      - name: Verify the way the updater will
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          req="anchor apple generic \
            and certificate 1[field.1.2.840.113635.100.6.2.6] exists \
            and certificate leaf[field.1.2.840.113635.100.6.1.13] exists \
            and certificate leaf[subject.OU] = \"$TEAM_ID\""
          for binary in codeconnect ccd cc-agent-host; do
            path="$DIR/$binary"
            codesign --verify --strict --all-architectures -R="identifier \"$binary\" and $req" "$path"
            # Captured, then searched — not piped into `grep -q`. `grep -q`
            # exits at the first match, and the SIGPIPE that can leave on
            # `codesign` would turn a present timestamp into a failed check.
            info="$(codesign --display --verbose=4 "$path" 2>&1)"
            if [[ $'\n'"$info" != *$'\n'Timestamp=* ]]; then
              echo "::error::$binary has no secure timestamp"
              exit 1
            fi
          done

      - name: Check the combined binaries say exactly what they are
        env:
          SHA: ${{ needs.pin.outputs.sha }}
          VERSION: ${{ needs.pin.outputs.version }}
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          # The same literal comparison the build jobs made per slice, repeated
          # on the file that will actually ship: `lipo` is the one step between
          # them, and a mis-combined binary would answer for the wrong code.
          for binary in codeconnect ccd; do
            expected="$binary $VERSION (${SHA:0:12})"
            said="$("$DIR/$binary" --version)"
            if [ "$said" != "$expected" ]; then
              echo "::error::$binary reports '$said', expected '$expected'"
              exit 1
            fi
          done
          # The agent host that ships, under its Developer ID signature: the
          # entitlements its slices ran with, in both halves, and the half this
          # runner can run still starts.
          mac/agent-host/entitled.sh "$DIR/cc-agent-host"
          mac/agent-host/check.sh "$DIR/cc-agent-host"

      # The Mac app, built in every run beside the archives and promoted with
      # them: it carries exactly the binaries this job just signed, notarized
      # and checked ($DIR, with the agent host's notices), so the app and the archives
      # can never disagree. Its version is the tag's, for Sparkle to compare.
      # The Xcode is the one the app is built and tested with, pinned by path on
      # a preview image, so a missing one fails here instead of building with
      # another compiler.
      - name: Build the Mac app
        env:
          VERSION: ${{ needs.pin.outputs.version }}
          DIR: ${{ needs.pin.outputs.dir }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcodebuild archive -project macos/CodeConnect.xcodeproj -scheme CodeConnect \
            -configuration Release -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/CodeConnect.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db --timestamp" \
            CODECONNECT_HELPERS="$GITHUB_WORKSPACE/$DIR"
          # Export for Developer ID re-signs the app and the code nested in it,
          # Sparkle's Autoupdate, Updater.app and XPC services included.
          /usr/libexec/PlistBuddy -c "Add :method string developer-id" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Developer ID Application" \
            -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CodeConnect.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          said="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/export/CodeConnect.app/Contents/Info.plist")"
          if [ "$said" != "$VERSION" ]; then
            echo "::error::the app says $said, the tag $VERSION"
            exit 1
          fi

      # The .dmg is the one download, for /mac and for Sparkle alike: notarized
      # and stapled, then signed for Sparkle (the staple changes its bytes, so
      # that comes after), its update feed written from that signature
      # (appcast.sh), then checked as Sparkle and Gatekeeper will check it,
      # each check beside its must-fail (mac-app-verify.sh).
      - name: Package and notarize the Mac app
        id: app
        env:
          VERSION: ${{ needs.pin.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          dmg="CodeConnect-$VERSION.dmg"
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/export/CodeConnect.app" "$RUNNER_TEMP/dmg/CodeConnect.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -quiet -fs HFS+ -format UDZO -volname CodeConnect \
            -srcfolder "$RUNNER_TEMP/dmg" "$dmg"
          identity="$(security find-identity -v -p codesigning \
            | awk '/Developer ID Application/ {print $2; exit}')"
          codesign --timestamp --sign "$identity" "$dmg"
          # As for the binaries: a completed notarytool is not an accepted one.
          if ! xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarize-app.json"; then
            cat "$RUNNER_TEMP/notarize-app.json" || true
            echo "::error::notarytool did not complete for $dmg"
            exit 1
          fi
          cat "$RUNNER_TEMP/notarize-app.json"
          status="$(jq -r '.status // empty' "$RUNNER_TEMP/notarize-app.json")"
          if [ "$status" != "Accepted" ]; then
            id="$(jq -r '.id // empty' "$RUNNER_TEMP/notarize-app.json")"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" --password "$APP_PASSWORD" || true
            fi
            echo "::error::notarization of $dmg is '${status:-unknown}', not Accepted"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          # Sparkle's own sign_update, from the package the app was built with.
          # The key exists in a file only for this command.
          sign_update="$(find "$RUNNER_TEMP/packages/artifacts" -path '*/bin/sign_update' -type f)"
          if [ "$(printf '%s\n' "$sign_update" | grep -c .)" != 1 ]; then
            echo "::error::expected one sign_update in the resolved packages, found: $sign_update"
            exit 1
          fi
          key="$RUNNER_TEMP/sparkle.key"
          ( umask 077; printf '%s' "$SPARKLE_KEY" > "$key" )
          signed="$("$sign_update" --ed-key-file "$key" "$dmg")"
          rm -f "$key"
          signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$signed")"
          length="$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<<"$signed")"
          # The whole feed, for this release alone; codeconnect.sh serves it unchanged.
          .github/workflows/appcast.sh "$VERSION" "$GITHUB_REPOSITORY" macos/release-notes.txt \
            "$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')" "$signature" "$length" > appcast.xml
          cat appcast.xml
          OPENSSL="$(brew --prefix openssl)/bin/openssl" \
            bash .github/workflows/mac-app-verify.sh "$dmg" appcast.xml notarized
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.pin.outputs.version }}
          DIR: ${{ needs.pin.outputs.dir }}
        run: |
          archive="codeconnect-$VERSION-macos-universal.tar.gz"
          # Named one by one, deliberately: `tar -czf "$archive" "$dir"` also
          # writes a directory member, and the updater's archive validator
          # allows only the three regular files. Packaging the directory would
          # publish an archive the product refuses to install.
          COPYFILE_DISABLE=1 tar -czf "$archive" \
            "$DIR/codeconnect" "$DIR/ccd" "$DIR/LICENSE"
          shasum -a 256 "$archive" > "$archive.sha256"
          host_archive="codeconnect-$VERSION-agent-host-macos-universal.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$host_archive" \
            "$DIR/cc-agent-host" "$DIR/AGENT_HOST_NOTICES"
          shasum -a 256 "$host_archive" > "$host_archive.sha256"
          {
            echo "archive=$archive"
            echo "host_archive=$host_archive"
          } >> "$GITHUB_OUTPUT"

      # Found in the authenticated listing, or created; its numeric id is what
      # every later step addresses (release-draft.sh).
      - name: Find or create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pin.outputs.tag }}
          SHA: ${{ needs.pin.outputs.sha }}
          VERSION: ${{ needs.pin.outputs.version }}
          PROMOTING: "false"
        run: .github/workflows/release-draft.sh

      - name: Attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          HOST_ARCHIVE: ${{ steps.package.outputs.host_archive }}
          DMG: ${{ steps.app.outputs.dmg }}
        run: |
          # By id, to this draft and no other. A rerun may find its own
          # earlier upload under the same name; that asset is deleted first,
          # because two assets cannot share a name and the bytes being
          # attached are the ones this run verified.
          for file in "$ARCHIVE" "$ARCHIVE.sha256" \
              "$HOST_ARCHIVE" "$HOST_ARCHIVE.sha256" "$DMG" "$DMG.sha256" appcast.xml; do
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$file\") | .id")"
            for asset in $existing; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              > /dev/null
          done
          # Read back what the draft now holds: every upload must have landed.
          asset_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          archive_id="$(asset_id "$ARCHIVE")"
          checksum_id="$(asset_id "$ARCHIVE.sha256")"
          host_archive_id="$(asset_id "$HOST_ARCHIVE")"
          host_checksum_id="$(asset_id "$HOST_ARCHIVE.sha256")"
          dmg_id="$(asset_id "$DMG")"
          dmg_checksum_id="$(asset_id "$DMG.sha256")"
          appcast_id="$(asset_id appcast.xml)"
          if [ -z "$archive_id" ] || [ -z "$checksum_id" ] \
              || [ -z "$host_archive_id" ] || [ -z "$host_checksum_id" ] \
              || [ -z "$dmg_id" ] || [ -z "$dmg_checksum_id" ] || [ -z "$appcast_id" ]; then
            echo "::error::the uploaded assets did not appear on draft $RELEASE_ID"
            exit 1
          fi

          # The Linux files exactly as `linux-sign` signed them, the same way.
          linux_assets='[]'
          for path in slices/linux-signed/*; do
            file="$(basename "$path")"
            existing="$(asset_id "$file")"
            for asset in $existing; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              > /dev/null
            id="$(asset_id "$file")"
            if [ -z "$id" ]; then
              echo "::error::$file did not appear on draft $RELEASE_ID"
              exit 1
            fi
            linux_assets="$(jq -c --argjson id "$id" --arg name "$file" '. + [{id: $id, name: $name}]' <<<"$linux_assets")"
          done
          if [ "$(jq 'length' <<<"$linux_assets")" != 12 ]; then
            echo "::error::expected the 12 signed Linux files, attached $(jq 'length' <<<"$linux_assets")"
            exit 1
          fi

      # Downloaded back from the draft rather than checked in place: this is
      # the first moment the bytes a user would actually receive have existed.
      # The promote job runs this same check on this draft before publishing it.
      - name: Verify the assets a user would receive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          VERSION: ${{ needs.pin.outputs.version }}
          SHA: ${{ needs.pin.outputs.sha }}
        run: |
          .github/workflows/release-verify.sh fetch "$RELEASE_ID" roundtrip
          OPENSSL="$(brew --prefix openssl)/bin/openssl" .github/workflows/release-verify.sh check roundtrip

      # A draft run ends here, on purpose: publication is the promote job.
      - name: Leave it as a verified draft
        env:
          TAG: ${{ needs.pin.outputs.tag }}
        run: |
          echo "$TAG is a verified draft. To publish it:"
          echo "  gh workflow run release.yml --ref $TAG -f tag=$TAG -f publish=true"

  # Publication: the draft a draft run built and verified, promoted unchanged.
  # Nothing is built, signed or notarized here and no repository secret is
  # read — the Apple team the check enforces is the one the pinned updater
  # source pins. The draft's assets are downloaded by id, checked by the same
  # release-verify.sh the draft run used, and published by the Publish step
  # only after it rechecks what the draft holds.
  promote:
    name: Verify and publish the draft
    needs: pin
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    # The image the draft job verifies on, so both checks run on the same tools.
    runs-on: xcode-27
    # Promotions run one at a time across ALL tags: the monotonic decision
    # compares against `releases/latest`, and two promotions in parallel
    # could each be newer than the latest they saw and publish out of order.
    # GitHub holds at most one *pending* run per group — a third promotion
    # cancels the waiting second, visibly, and a cancelled promotion has
    # published nothing. (`queue: max` would let them all wait, but no
    # released actionlint accepts the key yet, and weakening the workflow lint
    # costs more than a re-run.) The refusals inside the Publish step — draft
    # state, assets, monotonicity, tag→SHA — are what make ordering safe; this
    # group only removes the interleaving.
    concurrency:
      group: release-publish-serial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pin.outputs.sha }}

      # Only found, never created: publication promotes a draft a draft run made.
      - name: Find the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pin.outputs.tag }}
          SHA: ${{ needs.pin.outputs.sha }}
          VERSION: ${{ needs.pin.outputs.version }}
          PROMOTING: "true"
        run: .github/workflows/release-draft.sh

      - name: Verify the assets a user would receive
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          VERSION: ${{ needs.pin.outputs.version }}
          SHA: ${{ needs.pin.outputs.sha }}
        run: |
          .github/workflows/release-verify.sh fetch "$RELEASE_ID" roundtrip
          OPENSSL="$(brew --prefix openssl)/bin/openssl" .github/workflows/release-verify.sh check roundtrip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          ARCHIVE_ID: ${{ steps.assets.outputs.archive_id }}
          CHECKSUM_ID: ${{ steps.assets.outputs.checksum_id }}
          HOST_ARCHIVE_ID: ${{ steps.assets.outputs.host_archive_id }}
          HOST_CHECKSUM_ID: ${{ steps.assets.outputs.host_checksum_id }}
          DMG_ID: ${{ steps.assets.outputs.dmg_id }}
          DMG_CHECKSUM_ID: ${{ steps.assets.outputs.dmg_checksum_id }}
          APPCAST_ID: ${{ steps.assets.outputs.appcast_id }}
          LINUX_ASSETS: ${{ steps.assets.outputs.linux_assets }}
          ARCHIVE: ${{ steps.assets.outputs.archive }}
          HOST_ARCHIVE: ${{ steps.assets.outputs.host_archive }}
          DMG: ${{ steps.assets.outputs.dmg }}
          TAG: ${{ needs.pin.outputs.tag }}
          SHA: ${{ needs.pin.outputs.sha }}
          VERSION: ${{ needs.pin.outputs.version }}
        run: |
          # Publication is a PATCH on the id this run adopted, made only after
          # re-reading what that id holds *now*: still a draft or the
          # pre-release, still this
          # tag, and exactly the nineteen assets the verification step downloaded —
          # by id, name, and state, because an id survives a rename and the
          # updater selects by name — not whatever a concurrent writer left.
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if [ "$(jq -r '.draft or .prerelease' <<<"$state")" != "true" ]; then
            echo "::error::release $RELEASE_ID is no longer a draft or a pre-release; refusing"
            exit 1
          fi
          if [ "$(jq -r '.tag_name' <<<"$state")" != "$TAG" ]; then
            echo "::error::release $RELEASE_ID no longer names $TAG; refusing"
            exit 1
          fi
          held="$(jq -r '[.assets[] | {id, name, state}] | sort_by(.id) | tojson' <<<"$state")"
          expected="$(jq -n --argjson aid "$ARCHIVE_ID" --argjson cid "$CHECKSUM_ID" \
            --argjson haid "$HOST_ARCHIVE_ID" --argjson hcid "$HOST_CHECKSUM_ID" \
            --argjson did "$DMG_ID" --argjson dcid "$DMG_CHECKSUM_ID" --argjson iid "$APPCAST_ID" \
            --arg archive "$ARCHIVE" --arg host "$HOST_ARCHIVE" --arg dmg "$DMG" \
            --argjson linux "$LINUX_ASSETS" \
            '[{id: $aid, name: $archive, state: "uploaded"},
              {id: $cid, name: ($archive + ".sha256"), state: "uploaded"},
              {id: $haid, name: $host, state: "uploaded"},
              {id: $hcid, name: ($host + ".sha256"), state: "uploaded"},
              {id: $did, name: $dmg, state: "uploaded"},
              {id: $dcid, name: ($dmg + ".sha256"), state: "uploaded"},
              {id: $iid, name: "appcast.xml", state: "uploaded"}]
              + [$linux[] | {id, name, state: "uploaded"}] | sort_by(.id) | tojson')"
          if [ "$held" != "$(jq -r . <<<"$expected")" ]; then
            echo "::error::draft $RELEASE_ID does not hold exactly the verified assets; refusing"
            echo "held:     $held"
            echo "verified: $(jq -r . <<<"$expected")"
            exit 1
          fi
          # The monotonic decision again, at the moment it matters: the one
          # taken in `pin` is minutes old by now, and another release may have
          # been published while this one was building.
          if ! code=$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"); then
            echo "::error::could not reach the releases API"
            exit 1
          fi
          if [ "$code" = "200" ]; then
            previous="$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")"
            # shellcheck source=/dev/null
            . "$GITHUB_WORKSPACE/.github/workflows/version-order.sh"
            if ! version_strictly_newer "$VERSION" "${previous#v}"; then
              echo "::error::$VERSION is no longer newer than the published latest '$previous'"
              exit 1
            fi
          elif [ "$code" != "404" ]; then
            echo "::error::the releases API answered HTTP $code; refusing to guess"
            exit 1
          fi
          # And the tag still names the pinned commit: publishing makes the
          # tag permanent, so this is the last moment a moved tag can be a
          # refusal instead of a release.
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          at="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$at" != "$SHA" ]; then
            echo "::error::$TAG now resolves to $at, not the pinned $SHA; refusing"
            exit 1
          fi
          # Draft off, prerelease explicitly off, latest explicitly claimed:
          # an adopted draft could carry a prerelease flag from however it was
          # made, and either leftover would hide the release from
          # `releases/latest` — the only thing the updater reads.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=true --jq .html_url
