name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    name: Rust (daemon, shim, protocol)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        working-directory: mac
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: mac
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: mac
        run: cargo test --workspace

  linux:
    name: Rust on Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Clippy
        working-directory: mac
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests keep their stores under the temporary directory and make its
      # folder owner-only, as macOS's per-user TMPDIR already is. Linux's /tmp is
      # shared and not the runner's to change, so they get a folder of its own.
      - name: Test
        working-directory: mac
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --workspace

  # The release's Linux build and packaging, run on every change; see
  # linux-build.yml.
  linux-release-build:
    name: Linux release build
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ github.sha }}

  # The release's macOS agent host slices, each built and run on its own
  # architecture, on every change; see agent-host-mac.yml.
  agent-host-mac:
    name: Agent host (macOS)
    uses: ./.github/workflows/agent-host-mac.yml
    with:
      ref: ${{ github.sha }}

  msrv:
    name: Rust MSRV floor
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A declared floor that nothing compiles against is a wish, not a
      # guarantee, so CI builds the workspace on exactly the version
      # `mac/Cargo.toml` names. `rustls` pulls `zeroize`, which is published
      # with `edition2024`, so anything older cannot even parse the lockfile's
      # manifests. `--locked` so the lockfile, not a fresh resolve, is tested.
      - name: Pin the floor toolchain
        run: |
          floor="$(awk -F'"' '/^rust-version = /{print $2; exit}' mac/Cargo.toml)"
          rustup toolchain install "$floor" --profile minimal --no-self-update
          # A directory override at the repo root, which `rustup` finds by
          # walking up from `mac/` in the build step below. That is what pins
          # the floor for the rest of the job — no environment is carried
          # between steps, because nothing later needs the version as a value.
          rustup override set "$floor"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-msrv-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-

      - name: Build on the floor
        working-directory: mac
        run: cargo build --workspace --locked

  ios:
    name: Swift (app + unit tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Newest installed Xcode, never a pinned path. The app targets iOS 17 and
      # guards `scrollEdgeEffectStyle` with `if #available(iOS 26, *)`, but
      # `#available` is a *runtime* check — the symbol still has to exist in the
      # SDK to compile, so an older Xcode fails the build outright.
      - name: Select the newest Xcode
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          test -d "$newest" || { echo "::error::no Xcode on this runner"; exit 1; }
          sudo xcode-select -s "$newest"
          xcodebuild -version

      # Only the unit tests; the UI suite is the `ios-ui` job.
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # Pick a simulator that actually exists on this image rather than
          # naming one and hoping. Device names change with every Xcode.
          # `awk 'NR==1'` rather than `head -1`: under `pipefail`, `head`
          # exiting at its first line can hand the upstream stage a SIGPIPE,
          # and a successful selection then reads as a failed pipeline. awk
          # keeps reading to end-of-input.
          device=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^(]*\)(.*/\1/p' \
            | sed 's/[[:space:]]*$//' | awk 'NR==1')
          test -n "$device" || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "using simulator: $device"
          # Signed to run locally: ad hoc, with no team, certificate or profile. A
          # binary the build leaves unsigned gets no Keychain on the simulator
          # (errSecMissingEntitlement, -34018), and the unit tests read and write it.
          xcodebuild test \
            -project CodeConnect.xcodeproj \
            -scheme CodeConnect \
            -destination "platform=iOS Simulator,name=$device" \
            -only-testing:CodeConnectTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

  # **The iPhone UI suite, less two groups of classes.** RELEASING.md's UI
  # suite, on the iPhone 17 Pro the tests are written for, with Xcode 27.1 on
  # the image the Mac job uses, as the app is built with. Two groups are left
  # out by name, whole classes, and the whole suite runs on a Mac before every
  # release (RELEASING.md):
  # - Live: the class's file reads the test runner's environment, which is how
  #   a live test gets a computer's address and token (TEST_RUNNER_CC_*). A
  #   runner has no computer.
  # - Timed: the class's file, not live, passes a fixture clock (a
  #   `-CC_FIXTURE_…_MS` launch argument), measures elapsed wall time
  #   (`timeIntervalSince(`), or drags after a long press (`press(forDuration:`
  #   of half a second or more with `thenDragTo:`). Their timings hold on a Mac
  #   and not on this runner's three cores. A timed test has a class of its
  #   own, <Class>TimedUITests, so the rest of its class still runs here.
  # The first step holds both lists to those rules, so a new class that matches
  # one fails this job until it is named here, and a named class that stops
  # matching fails it too: nothing is run or left out unseen.
  ios-ui:
    name: iPhone UI tests (no computer)
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      LIVE_CLASSES: >-
        ApprovalFlowUITests EndRunLiveUITests FolderTrustLiveUITests
        HalfOpenSendUITests LiveDaemonUITests PairingLiveUITests
        MultiMachineLiveUITests SessionIdentityLiveUITests
      TIMED_CLASSES: >-
        BulkRemoveTimedUITests CardReorderTimedUITests DeckTimedUITests
        FleetLargeTypeScrollTimedUITests FleetRowChangeTimedUITests
        FleetRowRenderTimedUITests QuestionCardTimedUITests
        SessionShowAllTimedUITests SwipeToRemoveTimedUITests
    steps:
      - uses: actions/checkout@v4

      - name: The classes left out are the ones the rules find
        working-directory: ios/CodeConnectUITests
        run: |
          classes() { xargs sed -n 's/^final class \([A-Za-z0-9_]*\): .*/\1/p' | sort; }
          live=$(grep -l 'processInfo.environment' -- *.swift | classes)
          timed=$({
            grep -lE -- '-CC_FIXTURE_[A-Z_]+_MS' *.swift
            grep -lE 'timeIntervalSince\(' -- *.swift
            grep -lE 'press\(forDuration: *([1-9]|0\.[5-9])[0-9.]*, *thenDragTo:' -- *.swift
          } | sort -u | classes | comm -23 - <(echo "$live"))
          failed=0
          for group in LIVE TIMED; do
            found=$live; [ "$group" = TIMED ] && found=$timed
            list="${group}_CLASSES"
            named=$(printf '%s\n' ${!list} | sort)
            if [ "$found" != "$named" ]; then
              echo "::error::the $group classes in the suite differ from $list (< in the suite, > named)"
              diff <(echo "$found") <(echo "$named") || true
              failed=1
            fi
          done
          exit "$failed"

      # The image carries no iPhone 17 Pro, so the job makes one, fresh each
      # run, on the newest installed iOS that supports it, and boots it and
      # waits until it has finished booting, as ios/scripts/render-screens.sh
      # does, before the tests are handed to it.
      - name: A fresh iPhone 17 Pro simulator
        id: sim
        run: |
          type=$(xcrun simctl list -j devicetypes \
            | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier')
          [ -n "$type" ] || { echo "::error::Xcode has no iPhone 17 Pro device type"; exit 1; }
          runtime=$(xcrun simctl list -j runtimes | jq -r --arg t "$type" '
            [.runtimes[] | select(.platform == "iOS" and .isAvailable
              and any(.supportedDeviceTypes[]; .identifier == $t))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          [ -n "$runtime" ] || { echo "::error::no installed iOS runtime supports the iPhone 17 Pro"; exit 1; }
          udid=$(xcrun simctl create "iPhone 17 Pro" "$type" "$runtime")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "iPhone 17 Pro on $runtime: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # Signed to run locally, as the Swift job signs, and as Xcode signs the
      # suite by default on a Mac: an unsigned build gets no Keychain.
      - name: UI tests
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild -version
          skip=()
          for class in $LIVE_CLASSES $TIMED_CLASSES; do skip+=("-skip-testing:CodeConnectUITests/$class"); done
          xcodebuild test -project CodeConnect.xcodeproj -scheme CodeConnect \
            -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            -only-testing:CodeConnectUITests "${skip[@]}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

      # A failed run's result bundle, crash logs included, to read rather than
      # guess from the log.
      - name: Keep the result bundle of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-xcresult
          path: ${{ runner.temp }}/ui-tests.xcresult
          if-no-files-found: ignore

      - name: Delete the simulator
        if: always() && steps.sim.outputs.udid != ''
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl delete "$UDID"

  # **The Mac app, compiled on every change.** Without this job only the
  # release's draft job builds macos/, so a change could break the app with
  # every check here green. Debug and ad hoc, as the project configures Debug;
  # without the helpers, which a Debug build may lack (embed-helpers.sh), since
  # the release builds the shipping configuration with them. Built twice: as
  # Debug, and again without the DEBUG condition, so the code only Release
  # compiles (`#if !DEBUG`: the updater's start with the app's own feed, the
  # app's own setup, the Kit's keychain) is compiled too. Xcode 27.1, the one
  # the app is built and tested with, pinned by path on the image that carries
  # it, as the release pins it: a missing path fails here.
  mac-app:
    name: Mac app (build)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcodebuild build -project macos/CodeConnect.xcodeproj -scheme CodeConnect \
            -configuration Debug -destination "generic/platform=macOS"
          xcodebuild build -project macos/CodeConnect.xcodeproj -scheme CodeConnect \
            -configuration Debug -destination "generic/platform=macOS" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release workflow is the one file that holds the signing secrets
      # and decides what gets published, and nothing exercises it until the
      # day a release is cut — so a syntax error in it surfaces at the worst
      # possible moment unless something parses it on every push. This does.
      #
      # Pinned by version *and* checksum, fetched from the upstream release
      # rather than run as a third-party action: a job that guards the
      # publishing path must not itself execute code that can change under it.
      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          # No arguments: every file under .github/workflows, so a workflow
          # added later is covered without anyone remembering to add it.
          ./actionlint

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every pattern here leaked into source at least once: a tailnet name, a
      # home directory, an email address, and — found last, and by a human
      # rather than by this grep — the author's machine named in a code comment
      # as an example.
      #
      # It matches the author's actual identity rather than the *shape* of a
      # name, deliberately. A shape pattern also flags invented examples like
      # "Ada's Mac Studio", which are exactly what a comment should use, and a
      # check that fires on correct code is a check people learn to ignore.
      # LICENSE is excluded because the copyright line is supposed to say who
      # holds it, and the repository's own URL is excluded because a CI badge
      # has to name the repository it reports on. That exclusion is the exact
      # remote, not a prefix, and it has to stay that way: the exclusion once
      # named a *different* account than the one this repository lives in, so
      # the CI badge and the security-advisory link both pointed at a repository
      # that is not this one — and correcting either of them would then have
      # failed this very check. The Releases API form of the same repository
      # is the second allowance: the update checker has to name the
      # repository it updates from, and the API spells it
      # api.github.com/repos/<owner>/<repo>. The allowance *strips* the URL
      # from a matching line and re-tests what remains, rather than excusing
      # the line — an identifier sharing a line with the allowed URL still
      # fails.
      - name: No personal identifiers
        run: |
          # This file is excluded because it necessarily contains the pattern it
          # searches for, and would otherwise always match itself.
          #
          # `site/` is excluded because its pages are the published privacy
          # policy and support page, and App Store review requires both to name
          # a real contact. This rule exists to catch identifiers that leak into
          # code by accident; those two files exist to publish one on purpose.
          # The exclusion is that narrow deliberately — a name in any other
          # directory is still a failure.
          if grep -rIn --exclude-dir=.git --exclude-dir=internal --exclude-dir=site \
              --exclude=LICENSE --exclude=ci.yml \
              -iE "faisal|mumtaz|tailca[0-9]+|/Users/[a-z]+/(Documents|Desktop)|[0-9]+@gmail\.com" . \
              | sed -E 's#github\.com/(repos/)?faisalmumtaz89/CodeConnect##g' \
              | grep -iE "faisal|mumtaz|tailca[0-9]+|/Users/[a-z]+/(Documents|Desktop)|[0-9]+@gmail\.com"; then
            echo "::error::personal identifier found — scrub before merging"
            exit 1
          fi

      - name: No secret material
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=internal \
              -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' .; then
            echo "::error::private key material found"
            exit 1
          fi

      # Documents written for the people building this do not ship: they live in
      # a gitignored `internal/` directory. This catches a citation of one that
      # survives in a comment, where it is an unresolvable pointer for a reader.
      #
      # The milestone pattern is deliberately unbounded on the left. `\bW2b\b`
      # looks correct and silently exempts every snake_case identifier, because
      # `_` is a word character — `a_w2b_database_is_migrated` passes it. That
      # gap hid nine test names that printed on every test run.
      - name: No references to internal documents
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=internal --exclude=ci.yml --exclude=.gitignore \
              -iE 'project-spec|fix-plan|audit-[a-z]+\.md|panel-[a-z]+\.md|docs/(research|review)|[_a-z0-9]w[0-9]b?[_ ]|internal/[a-z]|[a-z]+-(plan|tracker)\.md' .; then
            echo "::error::reference to a document that is not in this repository"
            exit 1
          fi

      # **The sheet height policy is single-sourced.** iOS 26 draws a sheet at a
      # partial detent as an inset floating card and `.large` edge-to-edge, and
      # those are two different sizes — measured, every element 1.04145× larger
      # at `.large`. A sheet offering both therefore rescales mid-drag.
      # `CCSheetDetents` is where that is decided once; a raw
      # `presentationDetents` anywhere else is a sheet quietly opting out.
      - name: Sheets use the shared detent policy
        run: |
          if grep -rIn --include='*.swift' 'presentationDetents(' ios \
              | grep -v 'CCSheetDetents\.swift:'; then
            echo "::error::use .ccResizableSheet()/.ccTallSheet(), not raw presentationDetents"
            exit 1
          fi

      # **Every control in the Mac app can be found and read by accessibility
      # alone,** so a test drives it by identifier with no guesswork. Each one
      # carries an accessibilityIdentifier and a name. SwiftUI names a button
      # after the text in its label; a label that is only an image is named
      # after its symbol (both sidebar "+" buttons read "Add"), and a text
      # field's title names nothing. The script lives beside the app, so a
      # contributor runs the same check CI does.
      - name: Mac controls have identifiers and names
        run: ./macos/scripts/check-control-names.py

      # **A fixture the phone carries a copy of must equal the copy the Rust
      # side reads.** Xcode cannot reference a file outside its source root, so
      # `ios/**/Resources` and `macos/CodeConnect/Resources` hold literal
      # duplicates of `fixtures/` files rather than links — and until this step
      # nothing compared them. A regenerated
      # `refusal-sentences.json` once left the iOS copy a release behind, and the
      # composer failed *open* against a daemon that was refusing the link.
      #
      # The loop lives in the script rather than here so the gate a contributor
      # runs locally and the gate CI runs cannot drift apart — which is the exact
      # failure this step exists to prevent, one level up.
      - name: Duplicated fixtures match their source
        run: ./fixtures/check-duplicated-fixtures.sh
