name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    name: Rust (daemon, shim, protocol)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        working-directory: mac
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: mac
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: mac
        run: cargo test --workspace

  msrv:
    name: Rust MSRV floor
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A declared floor that nothing compiles against is a wish, not a
      # guarantee, so CI builds the workspace on exactly the version
      # `mac/Cargo.toml` names. `rustls` pulls `zeroize`, which is published
      # with `edition2024`, so anything older cannot even parse the lockfile's
      # manifests. `--locked` so the lockfile, not a fresh resolve, is tested.
      - name: Pin the floor toolchain
        run: |
          floor="$(awk -F'"' '/^rust-version = /{print $2; exit}' mac/Cargo.toml)"
          rustup toolchain install "$floor" --profile minimal --no-self-update
          # A directory override at the repo root, which `rustup` finds by
          # walking up from `mac/` in the build step below. That is what pins
          # the floor for the rest of the job — no environment is carried
          # between steps, because nothing later needs the version as a value.
          rustup override set "$floor"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-msrv-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-

      - name: Build on the floor
        working-directory: mac
        run: cargo build --workspace --locked

  ios:
    name: Swift (app + unit tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Newest installed Xcode, never a pinned path. The app targets iOS 17 and
      # guards `scrollEdgeEffectStyle` with `if #available(iOS 26, *)`, but
      # `#available` is a *runtime* check — the symbol still has to exist in the
      # SDK to compile, so an older Xcode fails the build outright.
      - name: Select the newest Xcode
        run: |
          newest=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          test -d "$newest" || { echo "::error::no Xcode on this runner"; exit 1; }
          sudo xcode-select -s "$newest"
          xcodebuild -version

      # Only the unit tests. The `*LiveUITests` suites drive the real app
      # against a running `ccd` and have nothing to talk to on a runner — they
      # skip cleanly, but running them here would buy nothing and cost several
      # minutes of simulator boot.
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          # Pick a simulator that actually exists on this image rather than
          # naming one and hoping. Device names change with every Xcode.
          # `awk 'NR==1'` rather than `head -1`: under `pipefail`, `head`
          # exiting at its first line can hand the upstream stage a SIGPIPE,
          # and a successful selection then reads as a failed pipeline. awk
          # keeps reading to end-of-input.
          device=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^(]*\)(.*/\1/p' \
            | sed 's/[[:space:]]*$//' | awk 'NR==1')
          test -n "$device" || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "using simulator: $device"
          xcodebuild test \
            -project CodeConnect.xcodeproj \
            -scheme CodeConnect \
            -destination "platform=iOS Simulator,name=$device" \
            -only-testing:CodeConnectTests \
            CODE_SIGNING_ALLOWED=NO

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release workflow is the one file that holds the signing secrets
      # and decides what gets published, and nothing exercises it until the
      # day a release is cut — so a syntax error in it surfaces at the worst
      # possible moment unless something parses it on every push. This does.
      #
      # Pinned by version *and* checksum, fetched from the upstream release
      # rather than run as a third-party action: a job that guards the
      # publishing path must not itself execute code that can change under it.
      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          # No arguments: every file under .github/workflows, so a workflow
          # added later is covered without anyone remembering to add it.
          ./actionlint

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every pattern here leaked into source at least once: a tailnet name, a
      # home directory, an email address, and — found last, and by a human
      # rather than by this grep — the author's machine named in a code comment
      # as an example.
      #
      # It matches the author's actual identity rather than the *shape* of a
      # name, deliberately. A shape pattern also flags invented examples like
      # "Ada's Mac Studio", which are exactly what a comment should use, and a
      # check that fires on correct code is a check people learn to ignore.
      # LICENSE is excluded because the copyright line is supposed to say who
      # holds it, and the repository's own URL is excluded because a CI badge
      # has to name the repository it reports on. That exclusion is the exact
      # remote, not a prefix, and it has to stay that way: the exclusion once
      # named a *different* account than the one this repository lives in, so
      # the CI badge and the security-advisory link both pointed at a repository
      # that is not this one — and correcting either of them would then have
      # failed this very check. The Releases API form of the same repository
      # is the second allowance: the update checker has to name the
      # repository it updates from, and the API spells it
      # api.github.com/repos/<owner>/<repo>. The allowance *strips* the URL
      # from a matching line and re-tests what remains, rather than excusing
      # the line — an identifier sharing a line with the allowed URL still
      # fails.
      - name: No personal identifiers
        run: |
          # This file is excluded because it necessarily contains the pattern it
          # searches for, and would otherwise always match itself.
          #
          # `site/` is excluded because its pages are the published privacy
          # policy and support page, and App Store review requires both to name
          # a real contact. This rule exists to catch identifiers that leak into
          # code by accident; those two files exist to publish one on purpose.
          # The exclusion is that narrow deliberately — a name in any other
          # directory is still a failure.
          if grep -rIn --exclude-dir=.git --exclude-dir=internal --exclude-dir=site \
              --exclude=LICENSE --exclude=ci.yml \
              -iE "faisal|mumtaz|tailca[0-9]+|/Users/[a-z]+/(Documents|Desktop)|[0-9]+@gmail\.com" . \
              | sed -E 's#github\.com/(repos/)?faisalmumtaz89/CodeConnect##g' \
              | grep -iE "faisal|mumtaz|tailca[0-9]+|/Users/[a-z]+/(Documents|Desktop)|[0-9]+@gmail\.com"; then
            echo "::error::personal identifier found — scrub before merging"
            exit 1
          fi

      - name: No secret material
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=internal \
              -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' .; then
            echo "::error::private key material found"
            exit 1
          fi

      # Documents written for the people building this do not ship: they live in
      # a gitignored `internal/` directory. This catches a citation of one that
      # survives in a comment, where it is an unresolvable pointer for a reader.
      #
      # The milestone pattern is deliberately unbounded on the left. `\bW2b\b`
      # looks correct and silently exempts every snake_case identifier, because
      # `_` is a word character — `a_w2b_database_is_migrated` passes it. That
      # gap hid nine test names that printed on every test run.
      - name: No references to internal documents
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=internal --exclude=ci.yml \
              -iE 'project-spec|fix-plan|audit-[a-z]+\.md|panel-[a-z]+\.md|docs/(research|review)|[_a-z0-9]w[0-9]b?[_ ]' .; then
            echo "::error::reference to a document that is not in this repository"
            exit 1
          fi

      # **The sheet height policy is single-sourced.** iOS 26 draws a sheet at a
      # partial detent as an inset floating card and `.large` edge-to-edge, and
      # those are two different sizes — measured, every element 1.04145× larger
      # at `.large`. A sheet offering both therefore rescales mid-drag.
      # `CCSheetDetents` is where that is decided once; a raw
      # `presentationDetents` anywhere else is a sheet quietly opting out.
      - name: Sheets use the shared detent policy
        run: |
          if grep -rIn --include='*.swift' 'presentationDetents(' ios \
              | grep -v 'CCSheetDetents\.swift:'; then
            echo "::error::use .ccResizableSheet()/.ccTallSheet(), not raw presentationDetents"
            exit 1
          fi
