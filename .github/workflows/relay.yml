name: Relay

# The relay is the one thing in this repository that runs on Linux, on someone
# else's machine, facing the network. `CI` builds the workspace on macOS, which
# proves nothing about the target this deploys to, so it gets its own workflow
# on its own runner rather than another job bolted onto that file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    name: Rust (relay, Linux)
    runs-on: ubuntu-latest
    steps:
      # Every action here is pinned to a commit, not a tag: this job is what
      # says a deployable image exists, and a tag is a pointer its author can
      # move under us. The trailing comment is the human-readable version, so
      # an upgrade stays a reviewable change rather than a silent one.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: ${{ runner.os }}-relay-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-relay-

      # Scoped to the two relay crates rather than the workspace. The rest of
      # it is the Mac daemon and its shim, which do not build on Linux and are
      # already covered on macOS by `CI`.
      - name: Clippy
        working-directory: mac
        run: cargo clippy -p push-core -p push-relay --all-targets -- -D warnings

      - name: Test
        working-directory: mac
        run: cargo test -p push-core -p push-relay --locked

      - name: Build
        working-directory: mac
        run: cargo build -p push-relay --release --locked

      # A green `cargo build` is not a deployable service. The image is the
      # artefact a deploy is cut from, and its base images, its runtime
      # packages and its non-root user are all things that can break without a
      # line of Rust changing, so it is built on every push too.
      - name: Build the deployment image
        run: docker build -f ops/push-relay/Dockerfile -t codeconnect-push-relay mac/
